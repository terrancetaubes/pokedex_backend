name: ci-cd

# CI: every pull request and every push to develop or release/**.
# CD: push to develop -> dev. Push to release/** -> itg. Branch flow: docs/BRANCHING_AND_RELEASE.md.

on:
  pull_request:
    branches: [develop, "release/**"]
  push:
    branches: [develop, "release/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: pokedex-backend

jobs:
  ci:
    name: CI (lint and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  deploy-dev:
    name: CD (dev)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
    secrets: inherit

  deploy-itg:
    name: CD (itg)
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: itg
    secrets: inherit
