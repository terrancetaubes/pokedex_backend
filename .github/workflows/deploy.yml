name: deploy

# Reusable deployment. Called by ci-cd.yml with the target environment.
# Every setting comes from the GitHub environment, so no value is hard-coded here.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      IMAGE_NAME: pokedex-backend
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps extension
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add --name containerapp --upgrade --yes
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "${IMAGE_NAME}:${{ github.sha }}" \
            .
      - name: Resolve agent app URL
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.AGENT_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "AGENT_APP_URL=https://${FQDN}" >> "$GITHUB_ENV"
      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}" \
            --set-env-vars \
              "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" \
              "AUTH_AUDIENCE=api://pokedex-api" \
              "AGENT_APP_URL=${AGENT_APP_URL}" \
              "AGENT_APP_SCOPE=${{ vars.AGENT_APP_SCOPE }}" \
              "ALLOWED_ORIGINS=${{ vars.UI_ORIGIN }}" \
              "AGENT_TIMEOUT_S=30"
